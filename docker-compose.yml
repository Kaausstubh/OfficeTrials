services:
  postgres:
    image: postgres:15-alpine
    container_name: advocate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: advocate_user
      POSTGRES_PASSWORD: advocate_pass
      POSTGRES_DB: advocate_desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advocate_user -d advocate_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: advocate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: advocate_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://advocate_user:advocate_pass@postgres:5432/advocate_desk?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "advocate-case-desk-super-secure-production-jwt-secret-key-32chars"
      JWT_EXPIRES_IN: "7d"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_DIR: "/app/storage/documents"
      CORS_ORIGIN: "http://localhost:80"
      AI_PROVIDER: "fallback"
    volumes:
      - doc_storage:/app/storage/documents
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: advocate_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
  doc_storage:
